<title>Family Hub Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Concept: one 1280x800 landscape stage scaled to fit any screen. Slate-blue = my calendar, dusty rose = family. */
:root{
  --bg:#122229; --panel:#2A4A55; --inner:rgba(225,240,255,0.10); --line:rgba(225,240,255,0.16); --pop:#24444E;
  --text:#F1F7FB; --soft:#E0EEF0; --muted:#CFE5E6; --faint:#A9C5C8;
  --accent:#8FE0D8; --me:#4C86C2; --family:#8CC7A0; --ink:#0B2A2C;
  --font:'Plus Jakarta Sans','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#stage{position:absolute;left:0;top:0;width:1280px;height:800px;box-sizing:border-box;padding:20px 24px 20px 20px;display:flex;flex-direction:row;gap:16px;transform-origin:0 0}
.content{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
.hdr{height:44px;display:flex;align-items:center;justify-content:space-between}
.hdr h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-.01em}
.hdr .sub{font-size:15px;color:var(--muted)}
.row{display:flex;align-items:baseline;gap:14px}
.main{flex:1;display:flex;gap:16px;min-height:0}
.panel{background:var(--panel);border-radius:16px;padding:16px;display:flex;flex-direction:column;min-height:0}
.btn{height:44px;min-width:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--inner);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.btn:active{transform:scale(.97)}
.ib{padding:0;width:44px}
svg{display:block}
/* calendar */
#cal{flex:1;min-width:0;gap:12px}
.ctop{display:flex;align-items:center;justify-content:space-between}
.ctop h2{margin:0;font-size:20px;font-weight:600}
.ctl{display:flex;align-items:center;gap:8px}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
#calbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.wk{flex:1;min-height:0}
.col{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
.dh{height:52px;border-radius:10px;background:var(--inner);color:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.dh.today{background:var(--accent);color:var(--ink)}
.dh span:first-child{font-size:12px;font-weight:500;letter-spacing:.04em}
.dh span:last-child{font-size:20px;font-weight:600}
.dl{flex:1;min-height:0;background:var(--inner);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.ev{border-radius:8px;padding:8px 8px 9px;color:var(--ink);font-size:13px;line-height:1.25;font-weight:500}
.ev.me{background:var(--me)} .ev.fam{background:var(--family)}
.ev b{display:block;font-size:11px;font-weight:600}
.dow{text-align:center;font-size:12px;font-weight:500;letter-spacing:.04em;color:var(--muted)}
.mg{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));gap:6px}
.cell{background:var(--inner);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:3px;overflow:hidden;min-width:0;cursor:pointer}
.cell.dim{background:#12171B}
.cell .n{width:26px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex:none}
.cell.dim .n{color:var(--faint)}
.cell.today .n{background:var(--accent);color:var(--ink)}
.chip{border-radius:6px;padding:2px 6px;color:var(--ink);font-size:11px;line-height:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.me{background:var(--me)} .chip.fam{background:var(--family)}
.chip.more{background:transparent;color:var(--muted);padding:0 4px}
.legend{display:flex;align-items:center;gap:8px}
.legend small{font-size:13px;color:var(--muted);margin-right:4px}
.dot{width:10px;height:10px;border-radius:5px}
.btn[aria-pressed=false]{opacity:.55}
/* right column */
#right{width:380px;display:flex;flex-direction:column;gap:16px;min-height:0}
#wx{flex:1;gap:14px}
#wx.compact{flex:none}
.wh{display:flex;align-items:center;justify-content:space-between}
.wh h2,.sh h2{margin:0;font-size:16px;font-weight:600;color:var(--soft)}
.wh span{font-size:13px;color:var(--muted)}
.cur{display:flex;align-items:center;gap:14px}
.cur .t{font-size:44px;font-weight:600;line-height:1}
.cur .d{font-size:14px;color:var(--soft);margin-top:4px}
.fc{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.fr{flex:1;min-height:0;border-radius:10px;background:var(--inner);padding:0 14px;display:flex;align-items:center;gap:8px;font-size:14px}
.fr b{width:48px;color:var(--soft)} .fr i{flex:1;font-style:normal;color:var(--muted)}
.fr em{font-style:normal;font-size:16px;font-weight:600} .fr u{text-decoration:none;width:44px;text-align:right;color:var(--muted)}
#sp{gap:10px}
#sp.big{flex:1}
.sh{display:flex;align-items:center;justify-content:space-between;height:44px;flex:none}
.sh .ctl{gap:8px}
.np{display:flex;align-items:center;gap:12px;flex:none}
.art{background:var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;color:var(--muted)}
.tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tx .a{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .b{font-size:13px;color:var(--muted)}
.tx .c{font-size:12px;color:var(--faint)}
.gh{width:44px;height:44px;border-radius:22px;border:0;background:transparent;color:var(--soft);display:flex;align-items:center;justify-content:center;flex:none}
.gh.on{color:var(--accent)}
.play{width:48px;height:48px;border-radius:24px;border:0;background:var(--accent);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.bar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex:none}
.bar div{flex:1;height:4px;border-radius:2px;background:var(--line)}
.bar div i{display:block;height:4px;border-radius:2px;background:var(--accent)}
.ctrl{display:flex;align-items:center;justify-content:space-between;flex:none}
.tabs{display:flex;gap:6px;flex:none}
.tab{flex:1;height:36px;border-radius:18px;border:1px solid var(--line);background:var(--inner);font-size:13px;font-weight:600}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:4px;scrollbar-width:none}
.list::-webkit-scrollbar{display:none}
.li{height:48px;flex:none;border-radius:10px;background:var(--inner);border:0;padding:0 8px;display:flex;align-items:center;gap:10px;text-align:left;width:100%}
.li .art{width:36px;height:36px;border-radius:6px}
.li .tx .a{font-size:14px} .li .tx .b{font-size:12px}
.li.cur2 .a{color:var(--accent)}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pt{border:0;background:var(--inner);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;text-align:left;font-size:12px;font-weight:600}
.pt .art{width:100%;aspect-ratio:1;border-radius:6px}
.srch{height:44px;flex:none;border-radius:12px;border:1px solid var(--accent);background:var(--inner);color:var(--text);font:inherit;font-size:14px;padding:0 14px;user-select:text;-webkit-user-select:text}
.srch::placeholder{color:var(--faint)}
/* dock */
.dock{width:72px;border-radius:16px;background:var(--panel);display:flex;flex-direction:column;gap:8px;padding:8px 6px;flex:none;box-sizing:border-box}
.dock .btn{flex:1;width:100%;min-width:0;height:auto;padding:0;border-radius:14px;flex-direction:column;gap:6px;font-size:10.5px;font-weight:600;letter-spacing:-.01em}
.note{font-size:12px;color:var(--faint);flex:none}
/* watch popup */
#pop{position:absolute;left:104px;top:calc(var(--vis,800px) - 20px);transform:translateY(-100%);max-height:calc(var(--vis,800px) - 40px);overflow-y:auto;width:380px;box-sizing:border-box;padding:16px;border-radius:16px;background:var(--pop);border:1px solid var(--line);box-shadow:0 12px 32px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:14px;z-index:5}
#pop[hidden]{display:none}
.ph{display:flex;align-items:center;justify-content:space-between;height:44px}
.ph h2{margin:0;font-size:16px;font-weight:600;color:var(--soft)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{position:relative;height:96px;border-radius:14px;background:var(--inner);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:0 8px;font-size:14px;font-weight:600;text-align:center;touch-action:manipulation}
.tile .x{position:absolute;left:-8px;top:-8px;width:28px;height:28px;border-radius:14px;background:var(--text);color:var(--ink);border:0;display:none;align-items:center;justify-content:center;padding:0}
.edit .tile .x{display:flex}
.edit .tile{animation:wob .35s ease-in-out infinite alternate}
@keyframes wob{from{transform:rotate(-1deg)}to{transform:rotate(1deg)}}
@media (prefers-reduced-motion:reduce){.edit .tile{animation:none}}
.addt{height:96px;border-radius:14px;border:2px dashed #3A454E;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600}
.pick{display:flex;flex-wrap:wrap;gap:8px}.pick.scroll{max-height:200px;overflow-y:auto}
.pick .btn{height:40px}
.hint{font-size:12px;color:var(--muted)}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--text);color:var(--ink);padding:10px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:9;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.show{opacity:1}

.dl{cursor:pointer}.ev,.chip,.li{cursor:pointer}
.ag{gap:4px}.agd{font-size:13px;font-weight:600;color:var(--soft);padding:10px 4px 4px}.agd.today{color:var(--accent)}
.ag-i{gap:12px;padding:0 12px}
#modal{position:absolute;left:0;top:0;width:100%;height:var(--vis,800px);background:rgba(8,11,14,.62);z-index:8;display:flex;align-items:center;justify-content:center}
#modal[hidden]{display:none}
.mc{width:560px;max-height:min(740px,calc(var(--vis,800px) - 16px));overflow-y:auto;background:var(--pop);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 16px 40px rgba(0,0,0,.5)}
.mc>*{flex:none}
.mh{display:flex;align-items:center;gap:12px}.mh h3{flex:1;margin:0;font-size:22px;font-weight:600;overflow-wrap:anywhere}
.mr{display:flex;gap:12px;font-size:14px;color:var(--text);line-height:1.45}.mr .k{width:80px;color:var(--muted);flex:none}
.fi{box-sizing:border-box;width:100%;height:44px;background:var(--inner);border:1px solid var(--line);border-radius:12px;color:var(--text);font:inherit;font-size:14px;padding:0 12px;user-select:text;-webkit-user-select:text;color-scheme:dark}
.fi:focus{outline:2px solid var(--accent);outline-offset:1px}
.frow,.seg{display:flex;gap:10px}.mf{display:flex;justify-content:flex-end;gap:8px}

/* Lagoon theme */
body{background:radial-gradient(120% 90% at 0% 0%,#2F6C73 0%,rgba(47,108,115,0) 55%),radial-gradient(90% 70% at 100% 100%,#2D4B6A 0%,rgba(45,75,106,0) 60%),linear-gradient(160deg,#1F3B44,#122229) fixed}
.panel,.dock{background:linear-gradient(180deg,rgba(225,240,255,0.13),rgba(225,240,255,0.05));border:1px solid rgba(225,240,255,0.14);box-shadow:inset 0 1px 0 rgba(225,240,255,0.12),0 10px 28px rgba(0,10,20,0.35)}
.btn.on,.dh.today,.tab.on{background:linear-gradient(135deg,#A9ECE4,#6CCBC4);border-color:transparent;color:var(--ink)}
.cell.today .n,.play{background:linear-gradient(135deg,#A9ECE4,#6CCBC4);color:var(--ink)}
.ev.me,.chip.me{background:linear-gradient(180deg,#34669A,#27537F);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.22)}
.ev.fam,.chip.fam{background:linear-gradient(180deg,#B7E2C2,#8CC7A0);color:#10261A}
.dh.today span,.btn.on span{color:var(--ink)}
.cell.dim{background:rgba(10,30,36,0.30)}
.dock .btn{background:linear-gradient(160deg,rgba(255,255,255,0.24),rgba(255,255,255,0.10));border:0;box-shadow:inset 0 1px 0 rgba(255,255,255,0.30),0 4px 10px rgba(0,10,20,0.28);justify-content:center}
.dock .btn.on{background:linear-gradient(135deg,#A9ECE4,#6CCBC4)}
.dock .btn img{width:38px;height:38px;border-radius:10px;display:block}
#pop,.mc{background:linear-gradient(180deg,#2C525D,#22434D)}
.tile{background:linear-gradient(160deg,rgba(255,255,255,0.20),rgba(255,255,255,0.08))}
.addt{border-color:rgba(225,240,255,0.30)}

.tile{flex-direction:column;gap:8px;padding:8px 6px}
.tile img{width:44px;height:44px;border-radius:12px;display:block}
.tile>span{font-size:12px;line-height:1.1;font-weight:600}
.tile .ph0{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;background:rgba(255,255,255,0.16);color:var(--text)}

.li>*,.pt>*{pointer-events:none}
.li,.pt{touch-action:manipulation}
</style>

<div id="stage">
  <nav class="dock" aria-label="App dock" id="dock"></nav>
  <div class="content">
  <div class="hdr">
    <div class="row"><h1 id="date"></h1><span class="sub" id="wkof"></span></div>
    <div class="row" style="gap:12px;align-items:center"><button class="btn ib" id="mic" aria-label="Voice assistant"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button><span style="font-size:28px;font-weight:600" id="clock"></span><span class="sub">Chicago</span></div>
  </div>
  <div class="main">
    <section class="panel" id="cal"></section>
    <section id="right">
      <div class="panel" id="wx"></div>
      <div class="panel" id="sp"></div>
    </section>
  </div>
  <div class="note" id="note">Preview version. Events you add are saved on this device. Page v2026-11-16e</div>
  </div>
  <div id="pop" hidden></div>
  <div id="modal" hidden></div>
  <div id="toast" role="status"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const I={
 l:'<path d="M15 6l-6 6 6 6"/>',r:'<path d="M9 6l6 6-6 6"/>',up:'<path d="M6 15l6-6 6 6"/>',dn:'<path d="M6 9l6 6 6-6"/>',
 x:'<path d="M6 6l12 12M18 6L6 18"/>',plus:'<path d="M12 5v14M5 12h14"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
 heart:'<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>',
 shuf:'<path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>',
 rep:'<path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/>',
 note:'<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>'
};
const svg=(p,s=20,w=2,f='none')=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${f}" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const fill=(p,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${p}</svg>`;
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- scale stage ---------- */
let fullH=innerHeight,lastW=innerWidth;
function fit(){
  const a=document.activeElement,kb=a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
  if(innerWidth!==lastW||!kb)fullH=innerHeight;else fullH=Math.max(fullH,innerHeight);
  lastW=innerWidth;
  const s=Math.min(innerWidth/1280,fullH/800),top=(fullH-800*s)/2,st=$('#stage');
  st.style.transform=`scale(${s})`;st.style.left=((innerWidth-1280*s)/2)+'px';st.style.top=top+'px';
  document.documentElement.style.setProperty('--vis',Math.max(300,(innerHeight-top)/s)+'px');
}
addEventListener('resize',fit);fit();
document.addEventListener('focusin',e=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))setTimeout(()=>{fit();e.target.scrollIntoView({block:'nearest'})},350)});
document.addEventListener('focusout',()=>setTimeout(fit,400));

/* ---------- toast ---------- */
let tt;function toast(m,ms){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),ms||1800)}

/* ---------- header ---------- */
const NOW=new Date();
const VER='2026-11-16e';
const LOADDAY=NOW.getDate();
function tick(){const n=new Date();if(n.getDate()!==LOADDAY){location.reload();return}$('#clock').textContent=n.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});$('#date').textContent=n.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}
tick();setInterval(tick,15000);

/* ---------- calendar ---------- */
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const same=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const t12=s=>{const p=s.split(':').map(Number);return ((p[0]+11)%12+1)+':'+String(p[1]).padStart(2,'0')+' '+(p[0]<12?'AM':'PM')};
const TODAY=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate());
const cal={view:'week',anchor:TODAY,me:true,fam:true};
const T24=['07:00','08:00','09:00','10:00','14:00','15:30','17:30','18:30'];
const plus1=s=>{const p=s.split(':').map(Number);return String((p[0]+1)%24).padStart(2,'0')+':'+String(p[1]).padStart(2,'0')};
const PLACES=['Home','Soccer field','School','Dentist','Grandma’s house','Downtown'];
function seed(){
  const out=[];
  for(let k=-45;k<=120;k++){
    const d=addDays(TODAY,k),i=Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5),a=(i*5+2)%7,f=(i*3+1)%5;
    const mk=(who,st,title)=>out.push({id:'s'+k+who+st,title,who,date:iso(d),start:st,end:plus1(st),allDay:false,repeat:'none',remind:'30',loc:PLACES[(i+st.length+k+99)%PLACES.length],guests:'',notes:'Sample notes for this event.'});
    if(a<3){mk('me',T24[(i*3)%4],'Sample event');if(a===2)mk('me',T24[4+(i%4)],'Sample event')}
    if(f<2)mk('fam',T24[4+((i+1)%4)],f?'Sample dinner':'Sample family');
  }
  return out;
}
const GON=!!(window.HubApp&&typeof window.HubApp.requestGoogleToken==='function');
let EV=GON?store.get('hub-events-g',[]):store.get('hub-events-v1',null);
if(!GON&&!EV){EV=seed();store.set('hub-events-v1',EV)}
const saveEV=()=>{if(!GON)store.set('hub-events-v1',EV)};
function occurs(e,d){
  const b=parse(e.date);if(iso(d)<e.date)return false;
  switch(e.repeat){
    case'daily':return true;
    case'weekly':return b.getDay()===d.getDay();
    case'monthly':return b.getDate()===d.getDate();
    case'yearly':return b.getDate()===d.getDate()&&b.getMonth()===d.getMonth();
    default:return e.date===iso(d);
  }
}
function eventsFor(d){
  return EV.filter(e=>occurs(e,d)&&(e.who==='me'?cal.me:cal.fam)).sort((a,b)=>(b.allDay-a.allDay)||a.start.localeCompare(b.start));
}
const lbl=e=>e.allDay?'All day':t12(e.start);

/* ---------- Google Calendar ---------- */
const G={tok:null,exp:0,err:'',authErr:false,syncAt:0,cals:store.get('hub-gcals',[]),map:store.get('hub-calmap',null),
  winS:addDays(TODAY,-45),winE:addDays(TODAY,120),pend:null,loading:false,again:false,asked:false};
const enc=encodeURIComponent;
function gToken(force){
  if(!force&&G.tok&&Date.now()<G.exp)return Promise.resolve(G.tok);
  if(G.pend)return G.pend;
  G.pend=new Promise((res,rej)=>{
    G.resolve=res;G.reject=rej;
    const to=setTimeout(()=>rej(new Error('Google sign-in timed out')),120000);
    G.clear=()=>clearTimeout(to);
    try{window.HubApp.requestGoogleToken()}catch(e){rej(e)}
  });
  const done=()=>{if(G.clear)G.clear();G.pend=null};
  G.pend.then(done,done);
  return G.pend;
}
window.onGoogleToken=(t,err)=>{
  if(t){G.tok=t;G.exp=Date.now()+50*60e3;G.err='';G.authErr=false;if(G.resolve)G.resolve(t)}
  else{G.tok=null;G.authErr=true;G.err=err||'Google sign-in failed';if(G.reject)G.reject(new Error(G.err))}
};
async function gapi(path,opt){
  opt=opt||{};
  const go=tk=>fetch('https://www.googleapis.com/calendar/v3/'+path,{method:opt.method||'GET',body:opt.body,headers:{Authorization:'Bearer '+tk,'Content-Type':'application/json'}});
  let t=await gToken(),r=await go(t);
  if(r.status===401){G.tok=null;t=await gToken(true);r=await go(t)}
  if(!r.ok){let m='';try{m=((await r.json()).error||{}).message}catch(e){}throw new Error(m||('Google error '+r.status))}
  return r.status===204?null:r.json();
}
function assign(c){
  const m=G.map||{};if(m[c.id])return m[c.id];
  if(c.primary)return 'me';if(/family/i.test(c.name))return 'fam';return 'off';
}
const hhmm=d=>String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
function conv(it,c,who,out){
  if(it.status==='cancelled')return;
  const me=(it.attendees||[]).find(a=>a.self);if(me&&me.responseStatus==='declined')return;
  const rm=it.reminders||{};
  const base={title:it.summary||'(No title)',who,calId:c.id,gid:it.id,
    repeat:it.recurringEventId?'series':'none',
    remind:rm.useDefault?'default':((rm.overrides||[])[0]?String(rm.overrides[0].minutes):'none'),
    loc:it.location||'',guests:(it.attendees||[]).map(a=>a.email).filter(Boolean).join(', '),
    notes:(it.description||'').replace(/<br\s*\/?>/gi,'\n').replace(/<[^>]*>/g,'')};
  if(it.start&&it.start.date){
    const s=it.start.date,e=it.end.date;
    for(let d=parse(s),n=0;iso(d)<e&&n<60;d=addDays(d,1),n++){const ds=iso(d);
      out.push({...base,id:'g|'+c.id+'|'+it.id+'|'+ds,date:ds,start:'00:00',end:'23:59',allDay:true,spanStart:s,spanEnd:e})}
  }else if(it.start&&it.start.dateTime){
    const sd=new Date(it.start.dateTime),ed=new Date(it.end.dateTime),ds=iso(sd);
    out.push({...base,id:'g|'+c.id+'|'+it.id+'|'+ds,date:ds,start:hhmm(sd),end:iso(ed)===ds?hhmm(ed):'23:59',allDay:false});
  }
}
function setNote(){
  const n=$('#note');if(!n)return;
  if(!GON)return;
  const t=G.syncAt?new Date(G.syncAt).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'';
  const vs=' · page v'+VER;
  n.textContent=(G.authErr&&!G.tok?'Google Calendar is not connected.':
    (G.syncAt?'Google Calendar · synced '+t+(G.err?' · can’t reach Google, showing saved events':''):(G.err?'Can’t reach Google Calendar yet.':'Connecting to Google Calendar…')))+vs;
}
async function gLoad(){
  if(!GON)return;
  if(G.loading){G.again=true;return}
  G.loading=true;
  try{
    const cl=await gapi('users/me/calendarList?minAccessRole=reader&maxResults=250');
    G.cals=(cl.items||[]).map(c=>({id:c.id,name:c.summaryOverride||c.summary||c.id,role:c.accessRole,primary:!!c.primary}));
    store.set('hub-gcals',G.cals);
    const tmin=enc(G.winS.toISOString()),tmax=enc(G.winE.toISOString()),out=[];
    for(const c of G.cals){
      const who=assign(c);if(who==='off')continue;
      let pt='';
      for(let p=0;p<6;p++){
        const j=await gapi(`calendars/${enc(c.id)}/events?singleEvents=true&orderBy=startTime&maxResults=500&timeMin=${tmin}&timeMax=${tmax}${pt?'&pageToken='+enc(pt):''}`);
        (j.items||[]).forEach(it=>conv(it,c,who,out));pt=j.nextPageToken;if(!pt)break;
      }
    }
    EV=out;store.set('hub-events-g',EV);G.syncAt=Date.now();G.err='';G.authErr=false;
    if(!G.map&&!G.asked&&!mod){G.asked=true;openCals()}
  }catch(e){G.err=e.message||'Could not reach Google'}
  G.loading=false;setNote();renderCal();
  if(G.again){G.again=false;gLoad()}
}
function gEnsure(){
  if(!GON)return;
  const a=cal.anchor;
  if(a<addDays(G.winS,10)||a>addDays(G.winE,-50)){G.winS=addDays(a,-60);G.winE=addDays(a,120);gLoad()}
}
function writeCal(who){
  const w=G.cals.filter(c=>assign(c)===who&&(c.role==='owner'||c.role==='writer'));
  return w.find(c=>c.primary)||w[0]||null;
}
function gBody(d,e){
  const o={summary:d.title,location:d.loc||''};
  if(d.allDay){
    let s=d.date,en=iso(addDays(parse(d.date),1));
    if(e&&e.allDay&&e.date===d.date&&e.spanStart){s=e.spanStart;en=e.spanEnd}
    o.start={date:s};o.end={date:en};
  }else{
    const tz=Intl.DateTimeFormat().resolvedOptions().timeZone;
    o.start={dateTime:d.date+'T'+d.start+':00',timeZone:tz};o.end={dateTime:d.date+'T'+d.end+':00',timeZone:tz};
  }
  if(!e||d.notes!==e.notes)o.description=d.notes||'';
  if(!e||d.remind!==e.remind){
    o.reminders=d.remind==='default'?{useDefault:true}:{useDefault:false,overrides:d.remind==='none'?[]:[{method:'popup',minutes:+d.remind}]};
  }
  if(!e||d.guests!==e.guests){
    o.attendees=d.guests.split(/[,;\s]+/).filter(x=>x.indexOf('@')>0).map(x=>({email:x}));
  }
  if(!e&&{daily:1,weekly:1,monthly:1,yearly:1}[d.repeat])o.recurrence=['RRULE:FREQ='+d.repeat.toUpperCase()];
  return o;
}
async function gSave(d,e){
  try{
    toast('Saving…',4000);
    if(e){
      await gapi(`calendars/${enc(e.calId)}/events/${enc(e.gid)}?sendUpdates=none`,{method:'PATCH',body:JSON.stringify(gBody(d,e))});
    }else{
      const c=writeCal(d.who);
      if(!c){toast('No editable Google calendar is set for '+CALN[d.who]+'. Open the settings button and choose one.',4500);return false}
      await gapi(`calendars/${enc(c.id)}/events?sendUpdates=none`,{method:'POST',body:JSON.stringify(gBody(d,null))});
    }
    toast('Event saved');gLoad();return true;
  }catch(err){toast('Could not save: '+err.message,4500);return false}
}
async function gDelete(e){
  try{
    toast('Deleting…',4000);
    await gapi(`calendars/${enc(e.calId)}/events/${enc(e.gid)}?sendUpdates=none`,{method:'DELETE'});
    EV=EV.filter(x=>!(x.calId===e.calId&&x.gid===e.gid));store.set('hub-events-g',EV);
    toast('Event deleted');gLoad();return true;
  }catch(err){toast('Could not delete: '+err.message,4500);return false}
}
function openCals(){
  const dr={};G.cals.forEach(c=>{dr[c.id]=assign(c)});
  mod={mode:'cals',draft:dr};renderModal();
}

function calTitle(){
  if(cal.view==='month')return new Date(cal.anchor.getFullYear(),cal.anchor.getMonth(),1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
  if(cal.view==='agenda'){const e=addDays(cal.anchor,20);return `Agenda · ${MON[cal.anchor.getMonth()]} ${cal.anchor.getDate()} – ${MON[e.getMonth()]} ${e.getDate()}`}
  const s=mondayOf(cal.anchor),e=addDays(s,6);
  return s.getMonth()===e.getMonth()?`${MON[s.getMonth()]} ${s.getDate()} – ${e.getDate()}, ${e.getFullYear()}`:`${MON[s.getMonth()]} ${s.getDate()} – ${MON[e.getMonth()]} ${e.getDate()}, ${e.getFullYear()}`;
}
function shift(n){
  if(cal.view==='week')cal.anchor=addDays(cal.anchor,7*n);
  else if(cal.view==='agenda')cal.anchor=addDays(cal.anchor,14*n);
  else cal.anchor=new Date(cal.anchor.getFullYear(),cal.anchor.getMonth()+n,1);
  renderCal();
}
const evAttr=(e,d)=>`data-ev="${e.id}" data-date="${iso(d)}"`;
function renderCal(){
  gEnsure();
  const m0=mondayOf(TODAY);
  $('#wkof').textContent='Week of '+MON[m0.getMonth()]+' '+m0.getDate();
  const vb=v=>`<button class="btn ${cal.view===v?'on':''}" data-a="${v}">${v[0].toUpperCase()+v.slice(1)}</button>`;
  let h=`<div class="ctop"><h2>${calTitle()}</h2><div class="ctl">
   <button class="btn ib" data-a="prev" aria-label="Previous">${svg(I.l)}</button>
   <button class="btn" data-a="today">Today</button>
   <button class="btn ib" data-a="next" aria-label="Next">${svg(I.r)}</button>
   <span style="width:4px"></span>${vb('week')}${vb('month')}${vb('agenda')}
   <button class="btn on" data-a="add" aria-label="Add event" style="padding:0 14px 0 10px">${svg(I.plus,18,2.4)}Add</button></div></div>`;
  if(cal.view==='week'){
    const ws=mondayOf(cal.anchor);h+='<div class="grid7 wk">';
    for(let k=0;k<7;k++){const d=addDays(ws,k);
      h+=`<div class="col"><div class="dh ${same(d,TODAY)?'today':''}" data-day="${+d}"><span>${['MON','TUE','WED','THU','FRI','SAT','SUN'][k]}</span><span>${d.getDate()}</span></div><div class="dl" data-addday="${iso(d)}">`+
      eventsFor(d).map(e=>`<div class="ev ${e.who}" ${evAttr(e,d)}><b>${lbl(e)}</b>${e.title}</div>`).join('')+'</div></div>'}
    h+='</div>';
  }else if(cal.view==='month'){
    const f=new Date(cal.anchor.getFullYear(),cal.anchor.getMonth(),1),st=addDays(f,-((f.getDay()+6)%7));
    h+='<div class="grid7" style="gap:6px">'+['MON','TUE','WED','THU','FRI','SAT','SUN'].map(x=>`<span class="dow">${x}</span>`).join('')+'</div><div class="mg">';
    for(let k=0;k<42;k++){const d=addDays(st,k),ev=eventsFor(d),inM=d.getMonth()===f.getMonth();
      h+=`<div class="cell ${inM?'':'dim'} ${same(d,TODAY)?'today':''}" data-day="${+d}"><span class="n">${d.getDate()}</span>`+
      (inM?ev.slice(0,1).map(e=>`<div class="chip ${e.who}" ${evAttr(e,d)}>${e.title}</div>`).join('')+(ev.length>1?`<div class="chip more">+${ev.length-1} more</div>`:''):'')+'</div>'}
    h+='</div>';
  }else{
    h+='<div class="list ag">';let any=false;
    for(let k=0;k<21;k++){const d=addDays(cal.anchor,k),ev=eventsFor(d);if(!ev.length)continue;any=true;
      h+=`<div class="agd ${same(d,TODAY)?'today':''}">${d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</div>`+
      ev.map(e=>`<button class="li ag-i" ${evAttr(e,d)}><span class="dot" style="background:var(--${e.who==='me'?'me':'family'})"></span><span style="width:84px;font-size:13px;color:var(--muted);text-align:left;flex:none">${lbl(e)}</span><div class="tx"><span class="a">${e.title}</span>${e.loc?`<span class="b">${e.loc}</span>`:''}</div></button>`).join('')}
    if(!any)h+='<div class="hint" style="padding:12px">No events in the next three weeks.</div>';
    h+='</div>';
  }
  if(GON&&G.authErr&&!G.tok)h+=`<div class="legend" style="flex:none"><span class="hint" style="flex:1">Google Calendar is not connected${G.err?': '+esc(G.err):''}</span><button class="btn on" data-a="gconnect">Connect Google</button></div>`;
  h+=`<div class="legend"><small>Showing</small>
   <button class="btn" data-a="me" aria-pressed="${cal.me}"><span class="dot" style="background:var(--me)"></span>My calendar</button>
   <button class="btn" data-a="fam" aria-pressed="${cal.fam}"><span class="dot" style="background:var(--family)"></span>Family calendar</button>${GON?`<span style="flex:1"></span><button class="btn ib" data-a="cals" aria-label="Choose calendars">${svg('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',20)}</button>`:''}</div>`;
  $('#cal').innerHTML=h;
}
$('#cal').addEventListener('click',e=>{
  const ev=e.target.closest('[data-ev]');
  if(ev){openView(ev.dataset.ev,ev.dataset.date);return}
  const ad=e.target.closest('[data-addday]');
  if(ad&&e.target===ad){openForm(null,parse(ad.dataset.addday));return}
  const d=e.target.closest('[data-day]');
  if(d){cal.anchor=new Date(+d.dataset.day);cal.view='week';renderCal();return}
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a==='prev')shift(-1);else if(a==='next')shift(1);
  else if(a==='today'){cal.anchor=TODAY;renderCal()}
  else if(a==='week'||a==='month'||a==='agenda'){if(a==='agenda'&&cal.view!=='agenda')cal.anchor=cal.view==='week'?mondayOf(cal.anchor):cal.anchor;cal.view=a;renderCal()}
  else if(a==='add')openForm(null,cal.view==='month'?TODAY:(cal.view==='week'&&mondayOf(cal.anchor)<=TODAY&&TODAY<=addDays(mondayOf(cal.anchor),6)?TODAY:cal.anchor));
  else if(a==='me'){cal.me=!cal.me;renderCal()}
  else if(a==='fam'){cal.fam=!cal.fam;renderCal()}
  else if(a==='gconnect'){G.err='';gLoad()}
  else if(a==='cals'){G.cals.length?openCals():toast('Calendars are not loaded yet')}
});

const rnd=n=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return Array.from(a,x=>'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'[x%62]).join('')};
async function spConnect(){
  if(!HUB||!HUB.takeSpotifyCallback){toast('Spotify sign-in only works in the tablet app');return}
  try{
    const v=rnd(64),st=rnd(16);
    const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));
    const ch=btoa(String.fromCharCode.apply(null,new Uint8Array(d))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    store.set('hub-sp-ver',{v,s:st});
    HUB.openUrl('https://accounts.spotify.com/authorize?'+new URLSearchParams({client_id:SP_ID,response_type:'code',redirect_uri:SP_REDIR,scope:SP_SCOPE,state:st,code_challenge_method:'S256',code_challenge:ch}).toString());
  }catch(e){toast('Could not start Spotify sign-in: '+e.message,4500)}
}
async function spToken(body){

  if(!r.ok){const e=new Error(j.error_description||j.error||'Spotify sign-in error');e.status=r.status;throw e}

window.onSpotifyCb=async()=>{

  try{await spToken({grant_type:'authorization_code',code:o.code,redirect_uri:SP_REDIR,code_verifier:ver.v});store.set('hub-sp-ver',null);S.err='';toast('Spotify connected');spPoll()}

};
async function spAccess(){

  const q=$('#q');if(q)q.addEventListener('input',()=>{sp.q=q.value;S.res=null;spSearch()});

$('#sp').addEventListener('click',e=>{
  const b=e.target.closest('[data-s]');if(!b)return;const a=b.dataset.s,i=spInfo();
  if(a==='connect')spConnect();
  else if(a==='retry'){S.tabErr='';S.recent=S.pls=S.queue=S.devs=null;renderSp(true);spTab()}
  else if(a==='open'){sp.big=true;renderWx();renderSp();spTab()}
  else if(a==='close'){sp.big=false;sp.search=false;sp.q='';renderWx();renderSp()}
  else if(a==='play'){
    if(i.has&&S.P){S.P.is_playing=!i.play;S.P.progress_ms=curPos(i)*1000;S.at=Date.now();renderSp();spCmd('PUT',i.play?'me/player/pause':'me/player/play')}
    else spPlay(null);
  }
  else if(a==='next')spCmd('POST','me/player/next');
  else if(a==='prev'){if(curPos(i)>5)spCmd('PUT','me/player/seek?position_ms=0');else spCmd('POST','me/player/previous')}
  else if(a==='seek'){if(!i.has||!i.d)return;const r=b.getBoundingClientRect(),f=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));spCmd('PUT','me/player/seek?position_ms='+Math.round(f*i.d*1000))}
  else if(a==='like'){const it=S.P&&S.P.item;if(!it)return;const was=S.liked;S.liked=!was;renderSp();
    spApi(was?'DELETE':'PUT','me/library?uris='+encodeURIComponent(it.uri)).then(()=>toast(was?'Removed from Liked Songs':'Added to Liked Songs')).catch(err=>{S.liked=was;renderSp();toast(spMsg(err),4500)})}
  else if(a==='shuf')spCmd('PUT','me/player/shuffle?state='+(!i.sh));
  else if(a==='rep')spCmd('PUT','me/player/repeat?state='+(i.rp?'off':'context'));
  else if(a==='tab'){sp.tab=b.dataset.n;sp.search=false;sp.q='';S.res=null;S.tabErr='';renderSp();spTab()}
  else if(a==='search'){sp.search=!sp.search;if(!sp.search){sp.q='';S.res=null;S.tabErr=''}renderSp();const q=$('#q');if(q)q.focus()}
  else if(a==='pick')spPlay({uris:[b.dataset.uri]});
  else if(a==='pl'){spPlay({context_uri:b.dataset.uri});toast('Starting playlist…')}
  else if(a==='dev'){spCmd('PUT','me/player',{device_ids:[b.dataset.id],play:true}).then(()=>setTimeout(spTab,900))}
  else if(a==='openapp'){try{if(!(HUB&&HUB.launch('com.spotify.music')))toast('Spotify app is not installed')}catch(err){}}
});

/* ---------- dock + Watch popup ---------- */
const OTHER=['Keep','Drive','Gemini','Claude'];
const ALL_APPS=['Netflix','Disney+','Paramount+','Prime Video','Pluto TV','Hulu (web)','YouTube','Max','Apple TV','Peacock'];
let apps=store.get('hub-watch',['Netflix','Disney+','Paramount+','Prime Video','Pluto TV']);
let popOpen=false,edit=false,adding=false;
const HUB=window.HubApp||null;
const PKG={Keep:'com.google.android.keep',Drive:'com.google.android.apps.docs',Gemini:'com.google.android.apps.bard',Claude:'com.anthropic.claude',Arlo:'com.arlo.app','Netflix':'com.netflix.mediaclient','Disney+':'com.disney.disneyplus','Paramount+':'com.cbs.app','Prime Video':'com.amazon.avod.thirdpartyclient','Pluto TV':'tv.pluto.android','YouTube':'com.google.android.youtube','Max':'com.wbd.stream','Apple TV':'com.apple.atve.androidtv.appletv','Peacock':'com.peacocktv.peacockandroid'};
const URLS={'Hulu (web)':'https://www.hulu.com'};
let custom=store.get('hub-custom',{}),installed=null,curPick=[];
function openApp(name){
  if(!HUB){toast('This would open '+name);return}
  const c=custom[name]||{},url=c.u||URLS[name],pkg=c.p||PKG[name];
  if(url){HUB.openUrl(url);return}
  let ok=false;try{ok=pkg&&HUB.launch(pkg)}catch(e){}
  if(!ok)toast(name+' is not installed');
}
window.hubHome=()=>{popOpen=false;edit=false;adding=false;mod=null;renderModal();renderDock();renderPop()};
const DI={Dashboard:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
 Keep:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/>',
 Drive:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
 Gemini:'<path d="M12 3l2 6 6 3-6 3-2 6-2-6-6-3 6-3z"/>',
 Claude:'<path d="M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-8l-5 4v-4H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/>',
 Watch:'<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/>',
 Arlo:'<path d="M3 8a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M15 11l6-3v8l-6-3"/>'};
const ICO=store.get('hub-ico',{});
function loadIcons(){
  if(!HUB||!HUB.getIcon)return;let ch=false;
  ['Keep','Drive','Gemini','Claude','Arlo'].forEach(n=>{if(ICO[n])return;try{const d=HUB.getIcon(PKG[n]);if(d){ICO[n]=d;ch=true}}catch(e){}});
  if(ch){store.set('hub-ico',ICO);renderDock()}
}
function renderDock(){
  const b=(n,extra='',cls='')=>`<button class="btn ${cls}" data-d="${n}" ${extra} aria-label="${n}">${ICO[n]?`<img alt="" src="data:image/png;base64,${ICO[n]}">`:svg(DI[n],26,1.8)}<span>${n}</span></button>`;
  $('#dock').innerHTML=b('Dashboard','','on')+OTHER.map(n=>b(n)).join('')+b('Watch',`id="wbtn" style="${popOpen?'border-color:var(--accent);color:var(--accent)':''}"`)+b('Arlo');
}
const pkgOf=n=>(custom[n]&&custom[n].p)||PKG[n]||'';
function tileIcon(n){
  const p=pkgOf(n);
  return p&&ICO['p:'+p]?`<img alt="" src="data:image/png;base64,${ICO['p:'+p]}">`:`<span class="ph0">${esc(n.trim().charAt(0).toUpperCase())}</span>`;
}
function loadWatchIcons(){
  if(!HUB||!HUB.getIcon)return;let ch=false;
  apps.forEach(n=>{const p=pkgOf(n);if(!p||ICO['p:'+p])return;try{const d=HUB.getIcon(p);if(d){ICO['p:'+p]=d;ch=true}}catch(e){}});
  if(ch){store.set('hub-ico',ICO);renderPop()}
}
function renderPop(){
  const p=$('#pop');p.hidden=!popOpen;if(!popOpen)return;
  if(HUB&&installed===null){try{installed=JSON.parse(HUB.getApps())}catch(e){installed=[]}}
  curPick=HUB?(installed||[]).filter(x=>!apps.includes(x.n)):ALL_APPS.filter(a=>!apps.includes(a)).map(n=>({n}));
  p.className=edit?'edit':'';
  setTimeout(loadWatchIcons,0);
  p.innerHTML=`<div class="ph"><h2>Watch</h2>${edit?'<button class="btn on" data-p="done">Done</button>':''}</div>
  <div class="tiles">`+apps.map(a=>`<div class="tile" data-app="${esc(a)}">${tileIcon(a)}<span>${esc(a)}</span><button class="x" data-p="rm" data-app="${esc(a)}" aria-label="Remove ${esc(a)}">${svg(I.x,14,3)}</button></div>`).join('')+
  `<button class="addt" data-p="add">${svg(I.plus,24)}Add app</button></div>`+
  (adding?`<div><div class="hint" style="margin-bottom:8px">${curPick.length?(HUB?'Pick an installed app':'Pick an app to add'):'Every app is already added'}</div><div class="pick scroll">`+curPick.map((a,i)=>`<button class="btn" data-p="addapp" data-i="${i}">${esc(a.n)}</button>`).join('')+`</div><div class="hint" style="margin:12px 0 8px">Or add any website</div><div style="display:flex;gap:8px"><input id="cn" class="fi" placeholder="Name" style="flex:1;min-width:0"><input id="cu" class="fi" placeholder="Web address" style="flex:1.4;min-width:0"><button class="btn on" data-p="addweb">Add</button></div></div>`:'')+
  `<span class="hint">${edit?'Tap X to remove an app. Tap + to add one.':'Tap an app to open it. Press and hold to edit.'}</span>`;
}
$('#dock').addEventListener('click',e=>{
  const b=e.target.closest('[data-d]');if(!b)return;const n=b.dataset.d;
  if(n==='Watch'){popOpen=!popOpen;edit=false;adding=false;renderDock();renderPop()}
  else if(n==='Dashboard'){popOpen=false;renderDock();renderPop()}
  else{popOpen=false;renderDock();renderPop();openApp(n)}
});
let lp=null,lpFired=false;
$('#pop').addEventListener('pointerdown',e=>{
  const t=e.target.closest('.tile');if(!t||edit)return;lpFired=false;
  lp=setTimeout(()=>{lpFired=true;edit=true;adding=false;renderPop()},550);
});
['pointerup','pointerleave','pointercancel'].forEach(ev=>$('#pop').addEventListener(ev,()=>{clearTimeout(lp);if(ev==='pointerup')setTimeout(()=>{lpFired=false},80)}));
$('#pop').addEventListener('contextmenu',e=>e.preventDefault());
$('#pop').addEventListener('click',e=>{
  if(lpFired){lpFired=false;return}
  const b=e.target.closest('[data-p]');
  if(b){const a=b.dataset.p;
    if(a==='rm'){apps=apps.filter(x=>x!==b.dataset.app);delete custom[b.dataset.app];store.set('hub-watch',apps);store.set('hub-custom',custom);renderPop()}
    else if(a==='done'){edit=false;adding=false;renderPop()}
    else if(a==='add'){adding=!adding;renderPop()}
    else if(a==='addweb'){const n=$('#cn').value.trim(),u=$('#cu').value.trim();if(!n||!u){toast('Enter a name and a web address');return}apps.push(n);custom[n]={u:/^https?:\/\//i.test(u)?u:'https://'+u};store.set('hub-watch',apps);store.set('hub-custom',custom);adding=false;renderPop();toast(n+' added')}
    else if(a==='addapp'){const it=curPick[+b.dataset.i];if(!it)return;apps.push(it.n);if(it.p)custom[it.n]={p:it.p};store.set('hub-watch',apps);store.set('hub-custom',custom);adding=false;renderPop();toast(it.n+' added')}
    return}
  const t=e.target.closest('.tile');
  if(t&&!edit){popOpen=false;renderDock();renderPop();openApp(t.dataset.app)}
});
document.addEventListener('pointerdown',e=>{
  if(popOpen&&!e.target.closest('#pop')&&!e.target.closest('#wbtn')){popOpen=false;edit=false;adding=false;renderDock();renderPop()}
});


/* ---------- hold the clock for 1.5 seconds to reload the newest page ---------- */
(function(){let t=null;const c=$('#clock');
  const go=()=>{toast('Reloading…');setTimeout(()=>{location.replace(location.pathname+'?v='+Date.now())},200)};
  c.addEventListener('pointerdown',()=>{clearTimeout(t);t=setTimeout(go,1500)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>c.addEventListener(ev,()=>clearTimeout(t)));
})();
/* ---------- mic + night dimming ---------- */
$('#mic').addEventListener('click',()=>{if(HUB&&HUB.assist)HUB.assist();else toast('The voice assistant works in the tablet app')});
const DIM={from:22,to:6,level:0.10,idle:30000};
let dimmed=false,wakeUntil=0,swallowUntil=0;
const inDim=()=>{const h=new Date().getHours();return DIM.from>DIM.to?(h>=DIM.from||h<DIM.to):(h>=DIM.from&&h<DIM.to)};
function applyDim(){
  const want=inDim()&&Date.now()>=wakeUntil;
  if(want===dimmed)return;dimmed=want;
  try{if(HUB&&HUB.setBrightness)HUB.setBrightness(want?DIM.level:-1)}catch(e){}
}
document.addEventListener('pointerdown',e=>{
  if(!inDim())return;
  const wasDimmed=dimmed;wakeUntil=Date.now()+DIM.idle;
  if(wasDimmed){e.stopPropagation();e.preventDefault();swallowUntil=Date.now()+700;applyDim()}
},true);
['pointerup','click','touchend','mouseup'].forEach(t=>document.addEventListener(t,e=>{if(Date.now()<swallowUntil){e.stopPropagation();e.preventDefault()}},true));
setInterval(applyDim,5000);applyDim();

renderCal();setNote();if(GON){gLoad();setInterval(gLoad,300000)}renderWx();loadWx();renderSp();if(window.onSpotifyCb)window.onSpotifyCb();spPoll();renderDock();renderPop();loadIcons();
</script>
